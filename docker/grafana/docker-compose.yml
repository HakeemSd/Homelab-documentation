services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3002:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    environment:
      - GF_SECURITY_ADMIN_USER=keem
      - GF_SECURITY_ADMIN_PASSWORD=ChangeThisPassword123!

volumes:
  grafana_data: